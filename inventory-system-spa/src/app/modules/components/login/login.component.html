<div class="container">
    <div class="row">
        <h2 class="text-center mt-5 main-text-color">Welcome!</h2>
        <div class="text-center mb-5 main-text-color">Inventory System - 2024</div>
    </div>
    <div class="row">
      <div class="col-md-12 login">
        <div class="card">
          <form class="card-body" [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="text-center">
              <img src="assets/images/logo.png" class="img-fluid logo img-thumbnail rounded-circle my-3"
                width="150px" alt="profile">
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" id="Username" formControlName="UserName" aria-describedby="emailHelp" placeholder="Email" >
            </div>
            <div class="mb-3">
              <input type="password" class="form-control" id="password" formControlName="Password" placeholder="Password">
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-login px-5 mb-2 w-100 fw-bold">Login</button>
            </div>
            <div class="mb-3 login-error" *ngIf="isLoginFailed">
              <div class="error-icon-container">
              <span class="error-icon">
                    <i class="fas fa-exclamation-triangle"></i>
              </span>
              </div>
              <div class="error-content">
                <span class="error-title">Login failed!</span><br />
                <span class="error-text">Invalid username or password.</span>
              </div>
            </div>
            <div id="emailHelp" class="form-text text-center mb-5 text-dark">Not
              Registered? <a href="#" class="main-text-color fw-bold"> Create an
                Account</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
