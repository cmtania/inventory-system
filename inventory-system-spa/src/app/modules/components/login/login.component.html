<div class="login-container">
  <div class="login-wrapper">
    <div class="login-card">
      <!-- Header Section -->
      <div class="login-header">
        <div class="logo-container">
          <img src="assets/images/logo.png" class="logo" alt="Logo">
        </div>
        <h1 class="login-title">Inventory System</h1>
        <p class="login-subtitle">Sign in your acount</p>
      </div>

      <!-- Form Section -->
      <form class="login-form" [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="form-group">
          <input 
            type="text" 
            id="username"
            class="form-input" 
            formControlName="UserName" 
            placeholder="Username"
            [class.error]="isLoginFailed">
        </div>

        <div class="form-group">
          <input 
            type="password" 
            id="password"
            class="form-input" 
            formControlName="Password" 
            placeholder="Password"
            [class.error]="isLoginFailed">
        </div>

        <!-- Error Message -->
        <div class="error-message" *ngIf="isLoginFailed">
          <i class="fas fa-exclamation-circle"></i>
          <span>Invalid email or password. Please try again.</span>
        </div>

        <!-- Login Button -->
        <button type="submit" class="login-btn" [disabled]="!loginForm.valid">
          <i class="fas fa-sign-in-alt"></i>
          Sign In
        </button>

        <!-- Forgot Password Link -->
        <div class="form-footer">
          <a href="#" class="forgot-password">Forgot your password?</a>
        </div>
      </form>

      <!-- Footer Section -->
      <div class="login-footer">
        <p>Don't have an account? <a href="#" class="signup-link">Create Account</a></p>
        <div class="year-info">© 2024 Inventory System</div>
      </div>
    </div>
  </div>
</div>
